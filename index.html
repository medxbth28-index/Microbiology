<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MedX — بنك أسئلة MCQ</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fcf6e8;--bg2:#f4e8d0;--ink:#4a3b2c;--mut:#8a7a68;--acc:#c0714a;--sage:#6f9a82;--ok:#2f9463;--okbg:#e2f4ea;--no:#d4524f;--nobg:#fbe4e2;--card:#fffdf7;--line:#eadfca}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Tajawal',Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1;display:none;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));max-width:760px;margin:0 auto;animation:fade .35s}
.screen.on{display:flex;flex-direction:column}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
h1{font-size:clamp(22px,5vw,32px);text-align:center;font-weight:800;margin:6px 0 2px}
.sub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:12px}
.credits{display:flex;justify-content:center;gap:clamp(12px,4vw,34px);margin:8px 0 18px}
.cr{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(42vw,200px)}
.sq{width:100%;aspect-ratio:1;border-radius:22px;background:#fff8e8 center/cover;border:3px solid #fff;box-shadow:0 8px 22px #8a6a3c30;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.sq img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font-family:'Pacifico','Segoe Script',cursive;direction:ltr;font-size:clamp(20px,5.2vw,30px);line-height:1.25;text-align:center;background:linear-gradient(90deg,#c2512b,#e0932c,#b8447a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #fff8)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.big{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 10px;text-align:center;box-shadow:0 4px 14px #8a6a3c18;transition:.2s;font-size:18px;font-weight:800}
.big small{display:block;font-weight:500;color:var(--mut);font-size:12.5px;margin-top:4px;direction:ltr}
.big:active{transform:scale(.97)}.big:hover{border-color:var(--acc);box-shadow:0 6px 18px #c0714a30}
.lects{display:grid;gap:14px;margin-top:10px}
.lects .big{padding:26px 14px;font-size:26px;color:var(--acc)}
.lects .big small{font-size:14px;color:var(--ink)}
.tb{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tb .sp{flex:1;font-weight:800;font-size:15px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:34px;height:34px;border-radius:10px;background:#fffaf0;border:1px solid var(--line);font-size:16px;display:flex;align-items:center;justify-content:center}
.chip{background:#fffaf0;border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:700;white-space:nowrap}
#sc{color:var(--ok)}
#bar{height:5px;background:#e9dcc3;border-radius:5px;overflow:hidden;margin:2px 0 12px}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--acc));transition:width .35s}
#hd{position:sticky;top:0;z-index:5;background:#fcf6e8f0;padding-top:4px;margin:0 -4px;padding-inline:4px;backdrop-filter:blur(6px)}
#hd .tb{margin-bottom:6px}
#stage{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:30px}
.q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;box-shadow:0 6px 20px #8a6a3c18}
.q.f{animation:inF .3s}.q.b{animation:inB .3s}
@keyframes inF{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
.qn{display:inline-block;background:var(--acc);color:#fff;border-radius:50%;width:30px;height:30px;line-height:30px;text-align:center;font-weight:800;font-size:14px;margin-bottom:8px}
.qt{font-size:clamp(16px,2.6vw,19px);font-weight:700;line-height:1.65;margin-bottom:12px;unicode-bidi:plaintext}
.opts{display:grid;gap:9px}
.opt{width:100%;background:#fff;border:2px solid var(--line);border-radius:13px;padding:12px 14px;font-size:clamp(15px,2.4vw,17px);line-height:1.55;text-align:start;unicode-bidi:plaintext;transition:.15s}
.opt:not(:disabled):hover{border-color:var(--sage);background:#f6faf6}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#1d6b45;font-weight:700}
.opt.no{background:var(--nobg);border-color:var(--no);color:#a63532;animation:shk .35s}
.opt.neu{background:#fdf1d8;border-color:#e0a93b}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{margin-top:12px;display:none}.fb.on{display:block;animation:fade .3s}
.res{font-weight:800;font-size:16px;margin-bottom:8px}
.res.ok{color:var(--ok)}.res.no{color:var(--no)}.res.neu{color:#b9801c}
.ans{background:var(--okbg);border-right:4px solid var(--ok);border-radius:10px;padding:10px 13px;font-weight:700;color:#1d6b45;font-size:15px;line-height:1.7;unicode-bidi:plaintext}
.ex{background:#fdf1d8;border-right:4px solid #e0a93b;border-radius:10px;padding:10px 13px;margin-top:8px;font-size:15px;line-height:1.85;color:#6b4a14}
.wn{margin-top:8px;color:#a0601f;font-size:13px}
.show{background:var(--sage);color:#fff;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700}
#nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
#nav button{flex:1;max-width:160px;background:var(--acc);color:#fff;border-radius:12px;padding:10px;font-size:15px;font-weight:700}
#nav button:disabled{opacity:.35}
#nav #pv{background:#fffaf0;color:var(--ink);border:1px solid var(--line)}
.end{text-align:center;padding:26px 14px}
.end .n{font-size:58px;font-weight:800;color:var(--acc);line-height:1.2}
.end p{margin:6px 0;color:var(--mut)}
.end .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.end .row button{background:var(--acc);color:#fff;border-radius:12px;padding:11px 20px;font-size:15px;font-weight:700}
.end .row button.g{background:#fffaf0;color:var(--ink);border:1px solid var(--line)}
@media(min-width:700px){.screen{padding-top:26px}.q{padding:24px 26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="screen on" id="home">
  <h1>🩺 بنك أسئلة MCQ</h1>
  <div class="sub">اختر الدكتور للبدء</div>
  <div class="credits">
    <div class="cr"><div class="sq"><img src="medx.jpg" alt="medx" onerror="this.replaceWith('🩺')"></div><div class="nm">Mustafa al_witify</div></div>
    <div class="cr"><div class="sq"><img src="qmc.jpg" alt="qmc" onerror="this.replaceWith('🎓')"></div><div class="nm">Hussain Akram</div></div>
  </div>
  <div class="grid" id="docs"></div>
</div>

<div class="screen" id="lec">
  <div class="tb"><button class="ib" onclick="go('home')" aria-label="رجوع">➜</button><div class="sp" id="lt"></div></div>
  <div class="lects" id="lects"></div>
</div>

<div class="screen" id="quiz">
  <div id="hd"><div class="tb">
    <button class="ib" onclick="go('lec')" aria-label="رجوع">➜</button>
    <button class="ib" onclick="go('home')" aria-label="القائمة الأولى">🏠</button>
    <div class="sp" id="qt2"></div>
    <span class="chip" id="pg"></span><span class="chip" id="sc"></span>
    <button class="ib" id="mu" onclick="toggleMute()" aria-label="الصوت">🔊</button>
  </div>
  <div id="bar"><i></i></div></div>
  <div id="stage"></div>
</div>

<script>
const DOCS=[{"id": "awras", "name": "د. اوراس", "sub": "Microbiology", "lects": [{"code": "L1", "title": "Introduction to Microbiology", "qs": [{"n": "1", "q": "Which of the following best describes the structure of the bacterial chromosome?", "o": ["A. Linear, multiple chromosomes, histone-bound", "B. Circular, usually single chromosome, not bound to histones", "C. Linear, single chromosome, histone-bound", "D. Circular, multiple chromosomes, histone-bound"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">B<\/bdi>", "ex": "التوضيح: البكتيريا بدائية النواة، وعادةً كروموسومها واحد ودائري وما يرتبط بالهستونات مثل الخلايا حقيقية النواة.", "warn": ""}, {"n": "2", "q": "One of the following components is found in the cell wall of Gram-positive bacteria and absent in Gram-negative bacteria?", "o": ["a. Lipopolysaccharide (LPS)", "b. Peptidoglycan", "c. Teichoic acid", "d. Porin proteins"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">c<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Teichoic acid<\/bdi> موجود بجدار البكتيريا الموجبة لغرام، ومو موجود بجدار السالبة.", "warn": ""}, {"n": "3", "q": "Which of the following is true about cell wall of gram-positive bacteria?", "o": ["a. It consists of multiple layers", "b. It is thicker than that associated with gram-negative bacteria", "c. It contains teichoic acids", "d. All of these"], "a": 3, "ans": "الإجابة: <bdi class=\"en\">d<\/bdi>", "ex": "التوضيح: جدار الـ <bdi class=\"en\">Gram-positive<\/bdi> سميك وبيه طبقات <bdi class=\"en\">Peptidoglycan<\/bdi> متعددة، ويحتوي <bdi class=\"en\">Teichoic acids<\/bdi>.", "warn": ""}, {"n": "4", "q": "A cluster of polar flagella is called:", "o": ["a. lophotrichous", "b. Amphitrichous", "c. Monotrichous", "d. Peritrichous"], "a": 0, "ans": "الإجابة: <bdi class=\"en\">a<\/bdi>", "ex": "التوضيح: لما تكون الأسواط متجمعة بقطب واحد نسمي ترتيبها <bdi class=\"en\">Lophotrichous<\/bdi>.", "warn": ""}, {"n": "5", "q": "The cell walls of many gram positive bacteria can be easily destroyed by the enzyme known as:", "o": ["A. Lipase", "B. Lysozyme", "C. Pectinase", "D. Peroxidase"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">B<\/bdi>", "ex": "التوضيح: إنزيم <bdi class=\"en\">Lysozyme<\/bdi> يكسر روابط الـ <bdi class=\"en\">Peptidoglycan<\/bdi> بالجدار الخلوي.", "warn": ""}]}, {"code": "L2", "title": "Bacterial Morphology and Structure", "qs": [{"n": "1", "q": "One of the particular structures of bacteria is:", "o": ["a. cell wall", "b. cytoplasm", "c. capsule", "d. cell membrane"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">c<\/bdi>", "ex": "التوضيح: الكبسولة <bdi class=\"en\">Capsule<\/bdi> تركيب إضافي، بينما الجدار والسيتوبلازم والغشاء تراكيب أساسية.", "warn": ""}, {"n": "2", "q": "Which of the following bacterial genera (that produces endospore) have medical importance?", "o": ["a. Clostridium", "b. Bacillus", "c. None of these", "d. Both (a) and (b)"], "a": 3, "ans": "الإجابة: <bdi class=\"en\">d<\/bdi>", "ex": "التوضيح: جنسَي <bdi class=\"en\">Bacillus<\/bdi> و<bdi class=\"en\">Clostridium<\/bdi> معروفين بتكوين الـ <bdi class=\"en\">Endospores<\/bdi>.", "warn": ""}, {"n": "3", "q": "Chemically the capsule may be:", "o": ["a. Polypeptide", "b. Polysaccharide", "c. Either (a) or (b)", "d. None of these"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">c<\/bdi>", "ex": "التوضيح: الكبسولة ممكن تكون <bdi class=\"en\">Polysaccharide<\/bdi> أو <bdi class=\"en\">Polypeptide<\/bdi> حسب نوع البكتيريا.", "warn": ""}, {"n": "4", "q": "One of the functions of cell wall is:", "o": ["a. Play an essential role in cell division", "b. cause septic shock", "c. Protect cells from dehydration and nutrient loss", "d. Help microbes resist phagocytosis"], "a": 0, "ans": "الإجابة: <bdi class=\"en\">a<\/bdi>", "ex": "التوضيح: الجدار الخلوي يساهم بانقسام الخلية ويحافظ على شكلها.", "warn": ""}, {"n": "5", "q": "The protein from which hook and filaments of flagella are composed of, is:", "o": ["a. Keratin", "b. Flagellin", "c. Gelatin", "d. Casein"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b<\/bdi>", "ex": "التوضيح: البروتين الأساسي لخيط السوط هو <bdi class=\"en\">Flagellin<\/bdi>. صياغة السؤال تذكر الـ <bdi class=\"en\">Hook<\/bdi> أيضاً.", "warn": ""}, {"n": "6", "q": "Which structure is primarily responsible for motility?", "o": ["a. Pili", "b. Capsule", "c. Flagella", "d. Ribosomes"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">c<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Flagella<\/bdi> هي التراكيب الأساسية لحركة البكتيريا.", "warn": ""}, {"n": "7", "q": "Transposons commonly contribute to which of the following phenomena in bacteria?", "o": ["A. Increased protein translation", "B. Loss of plasmids", "C. Antibiotic resistance spread", "D. Prevention of gene mutations"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">C<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Transposons<\/bdi> قطع <bdi class=\"en\">DNA<\/bdi> متحركة، وممكن تساهم بنشر جينات مقاومة المضادات.", "warn": ""}, {"n": "8", "q": "Which term describes the proteinaceous, filamentous appendages on the surface of some bacteria that are primarily responsible for the initial, specific attachment to host cells?", "o": ["a) Capsule", "b) Pill (or Fimbriae)", "c) Flagella"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Pili<\/bdi> أو <bdi class=\"en\">Fimbriae<\/bdi> تساعد البكتيريا على الالتصاق بخلايا المضيف.", "warn": ""}, {"n": "9", "q": "Which one of the following structures is involved in bacterial conjugation?", "o": ["a. Fimbriae", "b. Capsule", "c. Flagellum", "d. Sex pilus"], "a": 3, "ans": "الإجابة: <bdi class=\"en\">d<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Sex pilus<\/bdi> يساعد على اتصال البكتيريا أثناء الـ <bdi class=\"en\">Conjugation<\/bdi>.", "warn": ""}, {"n": "10", "q": "The outer membrane of Gram-negative bacteria contains lipopolysaccharide (LPS), which is also known as:", "o": ["a. Exotoxin", "b. Endotoxin", "c. Teichoic acid", "d. Murein"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">LPS<\/bdi> بالغشاء الخارجي للبكتيريا السالبة لغرام يحتوي جزء الـ <bdi class=\"en\">Endotoxin<\/bdi>.", "warn": ""}, {"n": "11", "q": "One of the following is not a function of cytoplasmic membrane", "o": ["a. Performs electron transport and energy production", "b. Contains ion pumps to maintain membrane potential", "c. Contains actin-like protein filaments: helps determine shape of cell", "d. Resistance of Antibiotics"], "a": 3, "ans": "الإجابة: <bdi class=\"en\">d<\/bdi>", "ex": "التوضيح: الاختيار المتوقع <bdi class=\"en\">d<\/bdi>. لكن مقاومة المضادات مو وظيفة حصرية للجدار؛ ممكن تشارك بيها آليات غشائية أيضاً.", "warn": ""}, {"n": "12", "q": "Which structure enables bacteria to survive extreme environmental conditions, such as high heat or desiccation?", "o": ["a) Flagella", "b) Capsule", "c) Endospore", "d) Pilus"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">c<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Endospore<\/bdi> تخلي البكتيريا تتحمل الحرارة والجفاف والظروف القاسية.", "warn": ""}, {"n": "13", "q": "What is the primary function of the bacterial ribosome?", "o": ["a. DNA replication", "b. Protein synthesis", "c. RNA splicing", "d. Cell wall synthesis"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b<\/bdi>", "ex": "التوضيح: وظيفة الـ <bdi class=\"en\">Ribosomes<\/bdi> الأساسية هي تصنيع البروتين <bdi class=\"en\">Protein synthesis<\/bdi>.", "warn": ""}, {"n": "14", "q": "The mobile segments of DNA are called:", "o": ["a. Operons", "b. Transposons", "c. Introns", "d. Exons"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b<\/bdi>", "ex": "التوضيح: القطع المتحركة من الـ <bdi class=\"en\">DNA<\/bdi> تسمى <bdi class=\"en\">Transposons<\/bdi>.", "warn": ""}, {"n": "15", "q": "Which of the following characteristics is not true of a plasmid?", "o": ["a. It is a circular piece of DNA.", "b. It is required for normal cell function.", "c. It is found in bacteria.", "d. It can be transferred from cell to cell."], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Plasmid DNA<\/bdi> إضافي مو ضروري للوظائف الأساسية، وقد يحمل جينات مقاومة.", "warn": ""}, {"n": "16", "q": "Endotoxin belongs to a class of biological molecules called:", "o": ["a. mucopolysaccharide", "b. lipopolysaccharides.", "c. nucleic acids.", "d. proteins."], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Endotoxin<\/bdi> هو جزء من <bdi class=\"en\">Lipopolysaccharide<\/bdi> (<bdi class=\"en\">LPS<\/bdi>).", "warn": ""}, {"n": "17", "q": "What is the primary function of a capsule in bacterial pathogenesis?", "o": ["A) To provide energy for bacterial movement", "B) To store DNA and other genetic material", "C) To protect the bacterium from phagocytosis by immune system", "D) To facilitate conjugation and horizontal gene transfer"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">C<\/bdi>", "ex": "التوضيح: الكبسولة تساعد البكتيريا على تجنب البلعمة <bdi class=\"en\">Phagocytosis<\/bdi>.", "warn": ""}, {"n": "18", "q": "What is the role of pili in bacterial pathogenesis?", "o": ["A) They provide protection from phagocytosis.", "B) They enable bacteria to move towards nutrients and away from harmful substances.", "C) They help bacteria adhere to host cells and colonize tissues.", "D) They store genetic material for horizontal gene transfer."], "a": 2, "ans": "الإجابة: <bdi class=\"en\">C<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Pili<\/bdi> تساعد على الالتصاق بخلايا المضيف واستعمار الأنسجة.", "warn": ""}, {"n": "19", "q": "Bacteria carry one or more flagella at the opposite poles known as:", "o": ["a. Monotrichous", "b. Lophotrichous", "c. Amphitrichous", "d. Peritrichous"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">c.<\/bdi>", "ex": "التوضيح: وجود أسواط بالقطبين المتقابلين يسمى <bdi class=\"en\">Amphitrichous<\/bdi>.", "warn": ""}, {"n": "20", "q": "All EXCEPT one are applicable to spore:", "o": ["a. Less water content", "b. Metabolically active", "c. Resistant to heat", "d. Tolerate absence of nutrition"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b.<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Endospore<\/bdi> خاملة أيضياً، لذلك <bdi class=\"en\">Metabolically active<\/bdi> هي العبارة غير الصحيحة.", "warn": ""}, {"n": "21", "q": "The outer membrane structure of Gram negative bacteria consist of the following EXCEPT:", "o": ["a. Lipopolysaccharide.", "b. Peptidoglycan", "c. Lipid A", "d. Phospholipid"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b.<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Peptidoglycan<\/bdi> طبقة رقيقة بالـ <bdi class=\"en\">Periplasm<\/bdi>، مو جزء من الـ <bdi class=\"en\">Outer membrane<\/bdi> نفسه.", "warn": ""}, {"n": "22", "q": "What virulence factor is common to all Gram negative bacilli:", "o": ["A. Capsule", "B. Exotoxin", "C. Endotoxin", "D. DNAse"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">C.<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Gram-negative<\/bdi> تمتلك <bdi class=\"en\">LPS<\/bdi>، وجزء <bdi class=\"en\">Lipid A<\/bdi> هو المسؤول عن تأثير الـ <bdi class=\"en\">Endotoxin<\/bdi>.", "warn": ""}, {"n": "23", "q": "25- Endotoxin produced by Gram-negative bacteria is present in:", "o": ["A. Peptidoglycan", "B. Lipopolysaccharide", "C. Theicholic aci", "D. Inner membrane"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">B.<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Endotoxin<\/bdi> مرتبط بالـ <bdi class=\"en\">LPS<\/bdi> الموجود بالغشاء الخارجي.", "warn": ""}, {"n": "24", "q": "39- What is the primary function of the bacterial cell wall in pathogenesis?", "o": ["A) To provide energy for bacterial movement", "B) To store DNA and other genetic material", "C) To protect the bacterium from the harsh environment of the host", "D) To facilitate conjugation and horizontal gene transfer"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">C)<\/bdi>", "ex": "التوضيح: الجدار يحمي البكتيريا من الضغط الأسموزي ويساعدها تحافظ على شكلها.", "warn": ""}, {"n": "25", "q": "During conjunction the genetic material will be transferred through", "o": ["a. Cell wall", "b. Medium", "c. Pili", "d. Capsule"], "a": 2, "ans": "الإجابة: <bdi class=\"en\">c.<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Sex pili<\/bdi> تساعد على الاتصال خلال الاقتران ونقل المادة الوراثية.", "warn": ""}, {"n": "26", "q": "Which of the following is a mismatch pairs?", "o": ["a. Capsule /antiphagocytic", "b. Cell wall / Gram stain", "c. Mesosome / mitochondria", "d. Cytoplasmic membrane / cell division"], "a": null, "ans": "الإجابة: <bdi class=\"en\">Uncertain<\/bdi>", "ex": "التوضيح: السؤال ملتبس ولا توجد إجابة وحيدة مؤكدة. الـ <bdi class=\"en\">Mesosome<\/bdi> مفهوم قديم ويُعد حالياً أثراً من تحضير العينة.", "warn": ""}, {"n": "27", "q": "Weakened cell wall of Gram negative bacteria by the action of penicillin known as:", "o": ["a. Protoplasts", "b. Spheroplasts", "c. Hemoplast", "d. a & b"], "a": 1, "ans": "الإجابة: <bdi class=\"en\">b.<\/bdi>", "ex": "التوضيح: الـ <bdi class=\"en\">Spheroplast<\/bdi> بكتيريا فقدت جزءاً من جدارها وبقيت أجزاء من الغلاف الخلوي.", "warn": ""}, {"n": "28", "q": "The periplasmic space in some Gram-negative bacteria contain", "o": ["a. B-lactamases", "b. porin", "c. Lipoprotein", "d. all the above"], "a": 0, "ans": "الإجابة: <bdi class=\"en\">a.<\/bdi>", "ex": "التوضيح: الاختيار الأقرب <bdi class=\"en\">a<\/bdi>؛ إنزيمات <bdi class=\"en\">Beta-lactamases<\/bdi> قد توجد بالـ <bdi class=\"en\">Periplasm<\/bdi>، بينما <bdi class=\"en\">Porins<\/bdi> موجودة بالغشاء الخارجي. خيارات السؤال ملتبسة.", "warn": ""}]}]}, {"id": "ibtisam", "name": "د. ابتسام", "sub": "Bacterial Growth & Nutrition", "lects": [{"code": "L1", "title": "Bacterial Growth", "qs": [{"n": "1", "q": "A researcher observes that a bacterial culture has stopped increasing in number. The rate of cell division equals the rate of cell death. Which of the following is the most likely cause of this \"Stationary Phase\"?", "o": ["a. Synthesis of secondary metabolites (like antibiotics) has ceased.", "b. Accumulation of toxic waste products and exhaustion of limiting nutrients.", "c. The bacteria have reverted to a \"Lag\" state to repair DNA.", "d. The temperature has exceeded the maximum growth temperature."], "a": 1, "ans": "Answer: b. Accumulation of toxic waste products and exhaustion of limiting nutrients.", "ex": "<strong>الشرح:<\/strong> بمرور الوقت بالأطوار الأخيرة للمزرعة البكتيرية، الأكل والمغذيات تخلص والبكتيريا تفرز فضلات سمية، فيصير معدل النمو مساوي لمعدل الموت وتدخل بـ (Stationary phase).", "warn": ""}, {"n": "2", "q": "Which primary condition triggers a bacterial culture to enter the Stationary phase?", "o": ["a) The introduction of an antibiotic to the medium.", "b) The exhaustion of essential nutrients or the accumulation of toxic waste products.", "c) The adaptation of the metabolic machinery to the new medium.", "d) A sudden drop in the incubation temperature."], "a": 1, "ans": "Answer: b) The exhaustion of essential nutrients or the accumulation of toxic waste products.", "ex": "<strong>الشرح:<\/strong> نفس الفكرة، السبب الرئيسي اللي يخلي البكتيريا تتوقف عن زيادة عددها وتدخل بالطور الثابت هو ينتهي الغذاء وتتراكم المواد السامة بالوسط.", "warn": ""}, {"n": "3", "q": "The standard method for measuring the concentration of viable bacteria (only living cells):", "o": ["a) Serial dilution and plate count method", "b) Direct microscopic count using a hemocytometer", "c) Turbidometric method using a spectrophotometer", "d) Measurement of biomass (dry weight)"], "a": 0, "ans": "Answer: a) Serial dilution and plate count method", "ex": "<strong>الشرح:<\/strong> التخفيف المتسلسل والزرع بالأطباق هية الطريقة القياسية اللي تحسبلك بس البكتيريا \"الحية\" وتنطيك قراءة بالـ CFU.", "warn": ""}, {"n": "4", "q": "Which of the following is NOT a macronutrient essential for bacterial growth?", "o": ["a. Carbon", "b. Nitrogen", "c. Phosphorus", "d. Calcium"], "a": 3, "ans": "Answer: d. Calcium", "ex": "<strong>الشرح:<\/strong> الكربون والنيتروجين والفسفور عناصر أساسية كبرى (Macronutrients) تحتاجها البكتيريا بكميات كبيرة للنمو عكس الكالسيوم.", "warn": ""}, {"n": "5", "q": "Which of the following is NOT a common method for measuring bacterial growth?", "o": ["a. Direct cell count", "b. Turbidimetric method", "c. Viable plate count", "d. Spectrophotometry"], "a": 3, "ans": "Answer: d. Spectrophotometry", "ex": "<strong>الشرح:<\/strong> المجهر والزرع وتكعير الوسط (Turbidity) هي الطرق المباشرة المعتمدة لقياس النمو والعد البكتيري بالمختبر.", "warn": ""}, {"n": "6", "q": "The time required for a cell to undergo binary fission is called the:", "o": ["a. exponential growth rate", "b. growth curve", "c. generation time", "d. lag period"], "a": 2, "ans": "Answer: c. generation time", "ex": "<strong>الشرح:<\/strong> \"Generation time\" هو الوقت المحدد اللي تحتاجه الخلية البكتيرية حتى تنقسم انقسم ثنائي وتتضاعف (تصير خليتين).", "warn": ""}, {"n": "7", "q": "Psychrophiles would be expected to grow:", "o": ["a. in hot springs", "b. at refrigeration temperatures", "c. on the human body", "d. at low pH"], "a": 1, "ans": "Answer: b. at refrigeration temperatures", "ex": "<strong>الشرح:<\/strong> جينات هاي البكتيريا تحب البرودة الشديدة، فتكبر وتتأقلم ببرودة الثلاجة (بين 0 إلى 20 درجة مئوية).", "warn": ""}, {"n": "8", "q": "An organism that can synthesize their own metabolites & depend on organic compounds / inorganic nutrients:", "o": ["a. photoautotroph", "b. chemoautotroph", "c. heterotrophy", "d. chemoheterotroph"], "a": 1, "ans": "Answer: b. chemoautotroph", "ex": "<strong>الشرح:<\/strong> الكائنات الكيميائية غير ذاتية التغذية تعتمد على المركبات العضوية حتى تأخذ منها الطاقة والكربون لبناء جسمها.", "warn": ""}, {"n": "9", "q": "pH required for the growth of most (pathogenic) bacteria is:", "o": ["a. 6.8 - 7.2 (أو 7.2 - 7.6 حسب المحاضرة)", "b. 5.6 - 8.2", "c. 3.0 - 6.0", "d. 8.0 - 14.0"], "a": 0, "ans": "Answer: a. 6.8 - 7.2", "ex": "<strong>الشرح:<\/strong> معظم البكتيريا المرضية (Neutrophiles) تنمو بشكل ممتاز بالوسط المتعادل القريب من حموضة دم وجسم الإنسان.", "warn": ""}, {"n": "10", "q": "During which phase of the bacterial growth curve is the rate of cell division equal to the rate of cell death, primarily due to nutrient depletion and accumulation of toxic waste products?", "o": ["Lag Phase", "Exponential Phase", "Stationary Phase", "Death phase"], "a": 2, "ans": "Answer: Stationary Phase", "ex": "<strong>الشرح:<\/strong> بهاي المرحلة يتساوى عدد البكتيريا المتكونة الجديدة ويا البكتيريا الميتة، فيصير الخط مستقيم بإنتاج الخلايا.", "warn": ""}, {"n": "11", "q": "A bacterium obtains its energy from oxidizing inorganic compounds (e.g., ammonia or sulfur) and obtains its carbon from CO₂. This organism would be classified as a:", "o": ["Chemoheterotroph", "Photoautotroph", "Chemoautotroph", "Photoheterotroph"], "a": 2, "ans": "Answer: Chemoautotroph", "ex": "<strong>الشرح:<\/strong> البكتيريا اللي تؤكسد مواد غير عضوية حتى تجيب طاقة وتستخدم CO₂ كمصدر كربون تصنف كـ Chemoautotroph.", "warn": ""}, {"n": "12", "q": "Obligate aerobes, such as Mycobacterium tuberculosis, require oxygen to grow. Their reliance on oxygen necessitates the presence of which crucial detoxifying enzyme(s) to neutralize toxic oxygen radicals (like superoxide and hydrogen peroxide)?", "o": ["Urease only", "Lysozyme and Endonucleases", "Catalase and Superoxide Dismutase", "Beta-lactamase and Peroxidase"], "a": 2, "ans": "Answer: Catalase and Superoxide Dismutase", "ex": "<strong>الشرح:<\/strong> الأكسجين يطلع جذور حرة سامة، للبكتيريا الهوائية أنزيمات SOD و Catalase تحميها وتحول هاي المواد السامة إلى ماء وأكسجين.", "warn": ""}, {"n": "13", "q": "An organism grows uniformly throughout a thioglycollate broth tube, with slightly denser growth concentrated at the surface. This oxygen requirement profile is characteristic of a:", "o": ["Obligate Aerobe", "Obligate Anaerobe", "Facultative Anaerobe", "Microaerophilic"], "a": 2, "ans": "Answer: Facultative Anaerobe", "ex": "<strong>الشرح:<\/strong> البكتيريا الاختيارية تنمو بوجود أو غياب الأكسجين وتكون بكثافة أكثر قريبة من السطح لأنها تنتج طاقة أكثر بالأكسجين.", "warn": ""}, {"n": "14", "q": "Bacteria tolerate high percent sodium chloride known as:", "o": ["a. Acidophilic", "b. Neutrophilic", "c. Halophilic", "d. Basophilic"], "a": 2, "ans": "Answer: c. Halophilic", "ex": "<strong>الشرح:<\/strong> مصطلح (Halophilic) يطلق على البكتيريا \"المحبة للملوحة\" وتتحمل تركيز عالي من ملح الطعام NaCl.", "warn": ""}, {"n": "15", "q": "Exhaustion of nutrition and accumulation of waste products is represented by:", "o": ["a. Logarithmic phase", "b. Latent phase", "c. Stationary phase", "d. Decline phase"], "a": 2, "ans": "Answer: c. Stationary phase", "ex": "<strong>الشرح:<\/strong> النقطة الفاصلة بالمنحنى اللي يقل بها الأكل وتكثر بها السموم تعبر عن دخول البكتيريا بالـ Stationary phase.", "warn": ""}]}, {"code": "L2", "title": "Bacterial Nutrition & Metabolism", "qs": [{"n": "1", "q": "If an organism shifts from aerobic respiration to fermentation due to the absence of oxygen, how does the change in energy metabolism compare?", "o": ["a) Energy production significantly increases due to substrate-level phosphorylation.", "b) Energy production remains constant, as fermentation is equally efficient.", "c) Energy production drastically decreases to 2 ATP per glucose molecule.", "d) Fermentation produces more NADH and thus generates more ATP than respiration."], "a": 2, "ans": "Answer: c) Energy production drastically decreases to 2 ATP per glucose molecule.", "ex": "<strong>الشرح:<\/strong> التنفس الهوائي ينطي طاقة عالية تتراوح بين 36 إلى 38 جزيئة ATP، بس لما تتحول البكتيريا للتخمر بغياب الأكسجين ينزل إنتاج الطاقة بشكل كبير إلى 2 ATP فقط.", "warn": ""}, {"n": "2", "q": "In anaerobic respiration, the final electron acceptor can be:", "o": ["a. Nitrate", "b. Sulfate", "c. Carbon dioxide", "d. All of the above"], "a": 3, "ans": "Answer: d. All of the above", "ex": "<strong>الشرح:<\/strong> بالتنفس اللاهوائي المستقبل النهائي للإلكترونات مو أكسجين، وإنما مركبات معدنية غير عضوية مثل النترات (NO₃⁻) أو الكبريتات (SO₄²⁻) أو ثاني أكسيد الكربون (CO₂).", "warn": ""}, {"n": "3", "q": "An organism that can synthesize their own metabolites & depend on organic compounds is:", "o": ["a. photoautotroph", "b. chemoautotroph", "c. heterotrophy", "d. chemoheterotroph"], "a": 1, "ans": "Answer: b. chemoautotroph", "ex": "<strong>الشرح:<\/strong> الكائنات غير ذاتية التغذية الكيميائية تعتمد على المركبات العضوية المأخوذة من البيئة كمصدر أساسي للطاقة والكربون.", "warn": ""}, {"n": "4", "q": "A bacterium obtains its energy from oxidizing inorganic compounds (e.g., ammonia or sulfur) and obtains its carbon from CO₂. This organism would be classified as a:", "o": ["a) Chemoheterotroph", "b) Photoautotroph", "c) Chemoautotroph", "d) Photoheterotroph"], "a": 2, "ans": "Answer: c) Chemoautotroph", "ex": "<strong>الشرح:<\/strong> البكتيريا اللي تأخذ طاقتها من أكسدة مركبات كيميائية غير عضوية (مثل السلفور والنيتروجين) وتستعمل CO₂ لبناء الكربون تسمى Chemoautotroph.", "warn": ""}, {"n": "5", "q": "Which of the following is NOT a macronutrient essential for bacterial growth?", "o": ["a. Carbon", "b. Nitrogen", "c. Phosphorus", "d. Calcium"], "a": 3, "ans": "Answer: d. Calcium", "ex": "<strong>الشرح:<\/strong> العناصر الكبرى الأساسية للنمو هي الكربون والنيتروجين والفسفور والأكسجين والهيدروجين والكبريت، بينما الكالسيوم يعتبر من العناصر الزهيدة/الدقيقة (Micronutrients).", "warn": ""}, {"n": "6", "q": "Growth Factors required by bacteria include:", "o": ["a. Amino acids", "b. Purines and pyrimidines", "c. Vitamins", "d. All of the above"], "a": 3, "ans": "Answer: d. All of the above", "ex": "<strong>الشرح:<\/strong> عوامل النمو (Growth factors) هي المكونات العضوية الدقيقة اللي تضم: الأحماض الأمينية، الفيتامينات، والقواعد النيتروجينية.", "warn": ""}, {"n": "7", "q": "Iron uptake system in bacteria relies on special iron-binding molecules called:", "o": ["a. Siderophores", "b. Porins", "c. Endotoxins", "d. Exotoxins"], "a": 0, "ans": "Answer: a. Siderophores", "ex": "<strong>الشرح:<\/strong> البكتيريا لما تدخل للأنسجة، تفرز جزيئات خاصة اسمها (Siderophores) ترتبط بالحديد وتجمعه وتساعد الخلية بامتصاصه.", "warn": ""}, {"n": "8", "q": "Define fermentation and give an example of fermentation?", "o": [], "a": null, "ans": "Answer: Fermentation is an oxidation-reduction process for energy production where both the electron donor and electron acceptor are organic compounds, producing a low energy yield (2 ATP per glucose).", "ex": "<strong>الشرح:<\/strong> التخمر عملية أيضية لاهوائية تعطي طاقة قليلة (2 ATP)، ويكون المانح والمستقبل للإلكترونات فيها مركبات عضوية، ومثالها تخمر حامض اللاكتيك أو الكحول.", "warn": ""}, {"n": "9", "q": "How does the organism obtain energy for living and growing?", "o": [], "a": null, "ans": "Answer: Organisms obtain energy through chemical metabolic reactions (catabolism) by oxidizing nutrients via respiration (aerobic/anaerobic) or fermentation to generate ATP.", "ex": "<strong>الشرح:<\/strong> الكائن الحي يحصل على الطاقة عن طريق تفاعلات الهدم (Catabolism) والتأكسد للمغذيات، ويخزن الطاقة بجزيئات ATP لاستعمالها بالنمو والعمليات الحيوية.", "warn": ""}, {"n": "10", "q": "Why is carbon essential as a nutrient?", "o": [], "a": null, "ans": "Answer: Carbon is a primary macronutrient essential for synthesizing all cellular organic components, such as proteins, lipids, carbohydrates, and nucleic acids.", "ex": "<strong>الشرح:<\/strong> الكربون هو الهيكل الأساسي لكل المكونات العضوية بالخلية البكتيرية مثل البروتينات والأحماض النووية والدهون.", "warn": ""}, {"n": "11", "q": "Explain what is meant by oxidation-reduction?", "o": [], "a": null, "ans": "Answer: Oxidation is the removal/loss of electrons from a molecule, while reduction is the gain of electrons by a molecule. They occur together as paired redox reactions to yield energy.", "ex": "<strong>الشرح:<\/strong> الأكسدة تعني فقدان الخلية أو الجزيء للإلكترونات، والاختزال يعني اكتساب إلكترونات، وتفاعلهم المزدوج هو اللي يحرر الطاقة بالأيض.", "warn": ""}, {"n": "12", "q": "Describe the classification of bacteria based on their nutritional requirements?", "o": [], "a": null, "ans": "Answer: Bacteria are classified based on:<br/>\n    1. Carbon/Energy Source: Autotrophs (utilize CO₂) and Heterotrophs (utilize organic compounds).<br/>\n    2. Nutritional Factors: Fastidious (require specific growth factors) and Non-fastidious.", "ex": "<strong>الشرح:<\/strong> تتقسم البكتيريا حسـب التغذية إلى \"ذاتية التغذية\" و\"غير ذاتية\"، وإلى متطلبة (Fastidious) وغير متطلبة (Non-fastidious) بناءً على حاجتها لعوامل النمو.", "warn": ""}, {"n": "13", "q": "Contrast catabolism and anabolism?", "o": [], "a": null, "ans": "Answer: Catabolism is the degradation process that breaks down complex molecules into simple ones and generates energy (ATP). Anabolism is the biosynthesis process that builds complex molecules from simple ones and requires energy (ATP).", "ex": "<strong>الشرح:<\/strong> الهدم (Catabolism) يكسر الجزيئات المعقدة حتى يعطينا طاقة، بينما البناء (Anabolism) يستهلك الطاقة حتى يبني المكونات والتركيبات الخلوية للبكتيريا.", "warn": ""}]}]}, {"id": "wissam", "name": "د. وسام", "sub": "Viral Structure & Replication", "lects": [{"code": "L1", "title": "Viral Structure", "qs": [{"n": "1", "q": "One of the following statements is NOT true for viruses:", "o": ["a. Viruses contain either DNA or RNA.", "b. Viruses lack mitochondria.", "c. Viruses contain a protein coat.", "d. Viruses multiply by binary fission."], "a": 3, "ans": "الإجابة: <span dir=\"auto\">d<\/span>", "ex": "<b>التوضيح:<\/b> الفيروسات ما تتكاثر بالانشطار الثنائي مثل البكتيريا، وإنما تستخدم الخلية المضيفة حتى تنتج فيروسات جديدة.", "warn": ""}, {"n": "2", "q": "Which type of viral genome can be directly translated into proteins by host ribosomes?", "o": ["a. Single-stranded DNA", "b. Double-stranded RNA", "c. Positive-sense RNA", "d. Negative-sense RNA"], "a": 2, "ans": "الإجابة: <span dir=\"auto\">c<\/span>", "ex": "<b>التوضيح:<\/b> الـ Positive-sense RNA يشتغل مباشرة مثل الـ mRNA، ولهذا الرايبوسومات تكدر تترجمه إلى بروتين. أما Negative-sense فلازم يتحول أولاً إلى Positive-sense RNA.", "warn": ""}, {"n": "3", "q": "the following statement about viral envelope is true:", "o": ["a. highly resistant to alcohol", "b. Confers stability to harsh environment", "c. derived from cytoplasmic membrane", "d. found only covering helical viruses"], "a": 2, "ans": "الإجابة: <span dir=\"auto\">c<\/span>", "ex": "<b>التوضيح:<\/b> الغلاف الفيروسي مشتق من أغشية الخلية المضيفة، ومو شرط كل فيروس مغلف يكون Helical.", "warn": ""}, {"n": "4", "q": "What is a characteristic feature of enveloped viruses?", "o": ["a. They have a lipid bilayer derived from host cell membranes", "b. They lack a capsid", "c. They do not contain glycoprotein spikes", "d. They are always spherical in shape"], "a": 0, "ans": "الإجابة: <span dir=\"auto\">A<\/span>", "ex": "<b>التوضيح:<\/b> الفيروس المغلف عنده غشاء دهني (Lipid bilayer) مأخوذ من أغشية الخلية المضيفة.", "warn": ""}, {"n": "5", "q": "What is the primary function of the viral envelope?", "o": ["a. To synthesize viral proteins", "b. To provide structural integrity to the virus", "c. To assist in host cell recognition and entry", "d. To replicate the viral genome"], "a": 2, "ans": "الإجابة: <span dir=\"auto\">c<\/span>", "ex": "<b>التوضيح:<\/b> الغلاف يحتوي بروتينات تساعد الفيروس يتعرف على مستقبلات الخلية ويدخل إلها.", "warn": ""}, {"n": "6", "q": "Which of the following is more resistant to harsh environmental factors?", "o": ["a. DNA viruses", "b. Enveloped viruses", "c. Non enveloped viruses", "d. RNA viruses"], "a": 2, "ans": "الإجابة: <span dir=\"auto\">C<\/span>", "ex": "<b>التوضيح:<\/b> الفيروسات غير المغلفة تتحمل الظروف البيئية أكثر، لأن ما عدها غلاف دهني حساس للجفاف والمنظفات.", "warn": ""}, {"n": "7", "q": "the following statement about viral capsid is true:", "o": ["a. May carry the antigenic determinants.", "b. Absent in enveloped viruses.", "c. derived from cytoplasmic membrane", "d. found only in helical viruses"], "a": 0, "ans": "الإجابة: <span dir=\"auto\">a<\/span>", "ex": "<b>التوضيح:<\/b> الـ Capsid غلاف بروتيني يحمي المادة الوراثية، وممكن يحتوي أجزاء تتعرف عليها المناعة تسمى Antigenic determinants.", "warn": ""}, {"n": "8", "q": "All human viruses contain:", "o": ["a. Both DNA and RNA.", "b. Ribosomes.", "c. Small number of enzymes.", "d. None of the above."], "a": 3, "ans": "الإجابة: <span dir=\"auto\">d<\/span>", "ex": "<b>التوضيح:<\/b> الفيروس يحتوي DNA أو RNA، مو الاثنين كجينوم، وما عنده Ribosomes. ومو كل الفيروسات لازم تحتوي إنزيمات داخل الجسيم الفيروسي.", "warn": ""}, {"n": "9", "q": "Viruses are classifies according to the following:", "o": ["a. Chemical composition.", "b. Small number of enzymes.", "c. Morphologic characters.", "d. Envelope."], "a": null, "ans": "الإجابة: <span dir=\"auto\">غير محسومة<\/span>", "ex": "<b>التوضيح:<\/b> السؤال غير محكم لأن أكثر من خيار يدخل ضمن أسس التصنيف؛ خصوصاً a وc وd. المحاضرة تذكر نوع المادة الوراثية، استراتيجية التكاثر، شكل الـ Capsid ووجود الغلاف أو غيابه.", "warn": "تنبيه: السؤال أو مفتاحه يحتاج تحفّظاً بسبب صياغته."}, {"n": "10", "q": "All the following about outer viral envelope are true except:", "o": ["a. Derived from the host cytoplasmic membrane.", "b. confers instability on the virus.", "c. Determine the serotype of the virus by different types of matrix protein.", "d. Reflect antigenic diversity by spikes."], "a": 2, "ans": "الإجابة: <span dir=\"auto\">c<\/span>", "ex": "<b>التوضيح:<\/b> الـ Spikes السطحية تساهم بالصفات المستضدية، أما الـ Matrix protein مو هو المسؤول الأساسي عن تحديد الـ Serotype.", "warn": ""}, {"n": "11", "q": "The main determinant of specificity of viral infectivity is located in:", "o": ["a. Capsid in the enveloped viruses", "b. Genetic material", "c. Matrix", "d. Spikes of the enveloped viruses"], "a": 3, "ans": "الإجابة: <span dir=\"auto\">D<\/span>", "ex": "<b>التوضيح:<\/b> الـ Spikes ترتبط بمستقبلات محددة على الخلايا، ولهذا تساعد تحدد شنو الخلايا اللي يگدر الفيروس يصيبها.", "warn": ""}, {"n": "12", "q": "Which of the following is a characteristic of viruses?", "o": ["a. They require a host cell to reproduce", "b. They have their own metabolic processes", "c. They can grow on nutrient agar", "d. They are larger than bacteria"], "a": 0, "ans": "الإجابة: <span dir=\"auto\">A<\/span>", "ex": "<b>التوضيح:<\/b> الفيروسات طفيليات إجبارية داخل الخلايا (Obligate intracellular parasites)، فلازم خلية حية حتى تتكاثر.", "warn": ""}]}, {"code": "L2", "title": "Viral Replication", "qs": [{"n": "1", "q": "In viral growth curve, eclipse period is:", "o": ["a. Associated with high viral load", "b. Follow the assembly step.", "c. The time at which viral enzymes are inactive.", "d. Characterized with zero number viruses."], "a": 3, "ans": "الإجابة: <span dir=\"auto\">d<\/span>", "ex": "<b>التوضيح:<\/b> خلال الـ Eclipse period ما نكدر نكشف جسيمات فيروسية معدية مكتملة، لأن الفيروس الأصلي تفكك والجديد بعده ما تكوّن. مو معناها اختفت كل مكونات الفيروس.", "warn": ""}, {"n": "2", "q": "The term \"eclipse period\" refers to:", "o": ["a. the period between epidemic outbreaks of diseases that occur in a cyclic pattern", "b. the time between exposure of an individual to a virus and the first appearance of disease", "c. the time between infection of a susceptible cell by a cytocidal virus and the first appearance of cytopathic effects", "d. the time between entry into the cell and disassembly of the parental virus and the appearance of the first progeny virus."], "a": 3, "ans": "الإجابة: <span dir=\"auto\">d<\/span>", "ex": "<b>التوضيح:<\/b> تبدأ فترة الـ Eclipse بعد دخول الفيروس وتفككه، وتنتهي من تظهر أول فيروسات جديدة معدية داخل الخلية.", "warn": ""}, {"n": "3", "q": "The host range of a virus is determined by", "o": ["a. the proteins on its surface and that of the host.", "b. the proteins in the hosts cell.", "c. the enzymes produced by the virus before it infects the cell.", "d. all of the above."], "a": 0, "ans": "الإجابة: <span dir=\"auto\">a<\/span>", "ex": "<b>التوضيح:<\/b> البروتينات الموجودة على سطح الفيروس لازم تتناسب ويا مستقبلات الخلية، مثل المفتاح والقفل (Lock and Key).", "warn": ""}, {"n": "4", "q": "Tropism :", "o": ["a. Is absent in animal viruses.", "b. Determined by outer proteins.", "c. Is not seen in attenuated viruses.", "d. Is not related to the host cell."], "a": 1, "ans": "الإجابة: <span dir=\"auto\">b<\/span>", "ex": "<b>التوضيح:<\/b> الـ Tropism يعني ميل الفيروس لإصابة خلايا أو أنسجة معينة، ويعتمد بشكل مهم على بروتينات الفيروس ومستقبلات الخلية.", "warn": ""}, {"n": "5", "q": "What is a major factor that determines which cell type a virus can infect?", "o": ["a. Cell shape", "b. Cell size", "c. Cell tropism", "d. Cell membrane thickness"], "a": 2, "ans": "الإجابة: <span dir=\"auto\">c<\/span>", "ex": "<b>التوضيح:<\/b> الـ Cell tropism يحدد نوع الخلايا اللي الفيروس يكدر يصيبها، ويرتبط بوجود المستقبلات المناسبة.", "warn": ""}, {"n": "6", "q": "What is the role of receptors on the cell surface in viral infection?", "o": ["a. To destroy the virus", "b. To replicate the virus", "c. To allow virus entry", "d. To transport the virus"], "a": 2, "ans": "الإجابة: <span dir=\"auto\">c<\/span>", "ex": "<b>التوضيح:<\/b> المستقبلات تساعد الفيروس يرتبط بالخلية ويدخل إلها. إذا ماكو مستقبل مناسب، غالباً ما يگدر يصيبها.", "warn": ""}, {"n": "7", "q": "All the following statements about virus attachment and adsorption to host cell are true except one:", "o": ["a. ruled by tropism", "b. is reversible", "c. active process which needs energy", "d. uses either pinocytic or phagocytic mechanisms."], "a": 2, "ans": "الإجابة: <span dir=\"auto\">c (المقصودة)<\/span>", "ex": "<b>التوضيح:<\/b> الـ Attachment ما يحتاج طاقة، بينما الـ Penetration يحتاج طاقة. لكن الخيار d أيضاً يصف آليات دخول الفيروس أكثر مما يصف الـ Attachment.", "warn": "تنبيه: السؤال أو مفتاحه يحتاج تحفّظاً بسبب صياغته."}, {"n": "8", "q": "Viral attachment to the target cell:", "o": ["a. Not related to tropism.", "b. Not requiring energy.", "c. Non specific process.", "d. Cannot be blocked by antibodies."], "a": 1, "ans": "الإجابة: <span dir=\"auto\">b<\/span>", "ex": "<b>التوضيح:<\/b> مرحلة الـ Attachment ما تحتاج طاقة، وهي عملية نوعية تعتمد على مستقبلات محددة.", "warn": ""}, {"n": "9", "q": "Assembly of new viral particles::", "o": ["a. Active process that requires energy.", "b. Occurs strictly in the cytoplasm.", "c. Started before genome replication.", "d. Is one of the late events in the replication cycle."], "a": 3, "ans": "الإجابة: <span dir=\"auto\">d<\/span>", "ex": "<b>التوضيح:<\/b> الـ Assembly تجي بالمراحل المتأخرة بعد تصنيع المادة الوراثية وبروتينات الفيروس، حتى تتجمع وتكوّن Virions جديدة.", "warn": ""}, {"n": "10", "q": "Which phase of the viral life cycle involves the release of new virions from the host cell?", "o": ["a. Attachment", "b. Penetration", "c. Un-coating", "d. Lysis or budding"], "a": 3, "ans": "الإجابة: <span dir=\"auto\">d<\/span>", "ex": "<b>التوضيح:<\/b> الفيروسات الجديدة تطلع من الخلية إما بتحللها (Lysis) أو بالتبرعم (Budding)، حسب نوع الفيروس.", "warn": ""}, {"n": "11", "q": "Regarding viral replication cycle:", "o": ["a. Adsorption or attachment is a non specific process.", "b. Enveloped viruses are released by budding.", "c. Non structural proteins are formed at the late stages.", "d. DNA viruses in general replicate in the cytoplasm."], "a": 1, "ans": "الإجابة: <span dir=\"auto\">b<\/span>", "ex": "<b>التوضيح:<\/b> الفيروسات المغلفة غالباً تطلع بالتبرعم، وبهذه العملية تكتسب الغلاف. أما أغلب DNA viruses فتتكاثر بالنواة، باستثناء Poxviruses حسب المحاضرة.", "warn": ""}, {"n": "12", "q": "Regarding viral replication cycle:", "o": ["a. Non enveloped viruses replicate by lytic cycle.", "b. Adsorption and penetration are late events.", "c. RNA viruses replicate in the nucleus.", "d. None of the above."], "a": 0, "ans": "الإجابة: <span dir=\"auto\">a (المقصودة)<\/span>", "ex": "<b>التوضيح:<\/b> الفيروسات غير المغلفة غالباً تتحرر بتحلل الخلية، بينما الـ Attachment والـ Penetration مراحل مبكرة. عبارة الخيار a مبسطة أكثر من اللازم.", "warn": "تنبيه: السؤال أو مفتاحه يحتاج تحفّظاً بسبب صياغته."}, {"n": "13", "q": "Eclipse period in viral replication:", "o": ["a. No virus is detectable within the cell", "b. Mostly accompanied with latent viruses", "c. Is a late event in the cycle", "d. Occur directly after assembly"], "a": 0, "ans": "الإجابة: <span dir=\"auto\">a (المقصودة)<\/span>", "ex": "<b>التوضيح:<\/b> المقصود أنه ماكو فيروس معدٍ مكتمل قابل للكشف خلال فترة الـ Eclipse، مو أنه ماكو مادة وراثية أو بروتينات فيروسية داخل الخلية.", "warn": "تنبيه: السؤال أو مفتاحه يحتاج تحفّظاً بسبب صياغته."}, {"n": "14", "q": "Regarding viral latency:", "o": ["a. There is no viral replication within the cell.", "b. Does not occur in immunopotent patient.", "c. All human viruses can undergo latency.", "d. Non of the above"], "a": 0, "ans": "الإجابة: <span dir=\"auto\">a (الأقرب)<\/span>", "ex": "<b>التوضيح:<\/b> بالـ Latency يبقى الجينوم الفيروسي داخل الخلية مع تعبير قليل أو معدوم للجينات، ومن دون إنتاج مستمر لفيروسات معدية. عبارة no viral replication مو دقيقة لكل الأنواع.", "warn": "تنبيه: السؤال أو مفتاحه يحتاج تحفّظاً بسبب صياغته."}, {"n": "15", "q": "Cells that support viral replication are called", "o": ["a. Oncogenic cells", "b. Mutant cells", "c. Opportunistic cells", "d. Permissive cells"], "a": 3, "ans": "الإجابة: <span dir=\"auto\">d<\/span>", "ex": "<b>التوضيح:<\/b> الـ Permissive cell هي خلية تسمح للفيروس يكمل دورة تكاثره وينتج فيروسات جديدة.", "warn": ""}]}]}, {"id": "ibrahim", "name": "د. ابراهيم", "sub": "Innate Immunity & Complement", "lects": [{"code": "L1", "title": "Innate Immunity", "qs": [{"n": "1", "q": "You step on a rusty nail. Within minutes the foot is red, warm and swollen. Which cells arrive in the greatest numbers in the first hours?", "o": ["A) Neutrophils", "B) Plasma cells", "C) Cytotoxic T cells", "D) Memory B cells"], "a": 0, "ans": "Answer: A) Neutrophils", "ex": "<strong>الشرح:<\/strong> النيوتروفيل هي أول خلايا مناعية توصل لمكان الإحساس أو الجرح بكميات كبيرة خلال الساعات الأولى للالتهاب الحاد.", "warn": ""}, {"n": "2", "q": "Which feature is true of innate immunity only?", "o": ["A) Rapid response without memory", "B) Receptors made by gene rearrangement", "C) Clonal expansion of lymphocytes", "D) Improves with repeat exposure"], "a": 0, "ans": "Answer: A) Rapid response without memory", "ex": "<strong>الشرح:<\/strong> المناعة الفطرية تتميز بأنها تستجيب فوراً وسريعاً للميكروبات، بس ما تملك ذاكرة مناعية (No memory) من تتكرر الإصابة.", "warn": ""}, {"n": "3", "q": "Which pattern recognition receptor senses bacterial flagellin?", "o": ["A) TLR3", "B) TLR4", "C) TLR5", "D) RIG-I"], "a": 2, "ans": "Answer: C) TLR5", "ex": "<strong>الشرح:<\/strong> مستقبل التعرف النمطي TLR5 هو المسؤول عن التعرف على أسواط البكتيريا (Flagellin) وتفعيل الخلية المناعية.", "warn": ""}, {"n": "4", "q": "NK cells preferentially kill a cell that shows:", "o": ["A) High MHC class I", "B) Low or absent MHC class I", "C) Only IgG on its surface", "D) Free flagellin"], "a": 1, "ans": "Answer: B) Low or absent MHC class I", "ex": "<strong>الشرح:<\/strong> خلايا NK تهاجم وتقتل الخلايا المصابة بالفيروسات أو السرطانية اللي تفقد أو يقل على سطحها بروتين التوافق النسيجي الأول (MHC class I).", "warn": ""}, {"n": "5", "q": "TLR4 recognizes which pathogen-associated molecular pattern (PAMP)?", "o": ["A) Flagellin", "B) dsRNA", "C) Lipopolysaccharide (LPS)", "D) CpG DNA"], "a": 2, "ans": "Answer: C) Lipopolysaccharide (LPS)", "ex": "<strong>الشرح:<\/strong> مستقبل TLR4 يتعرف تحديداً على مادة الـ LPS الموجودة بالجدار الخارجي للبكتيريا سالبة غرام.", "warn": ""}, {"n": "6", "q": "TLR3 recognizes which type of microbial nucleic acid?", "o": ["A) Double-stranded RNA (dsRNA)", "B) Single-stranded RNA (ssRNA)", "C) CpG DNA", "D) Flagellin"], "a": 0, "ans": "Answer: A) Double-stranded RNA (dsRNA)", "ex": "<strong>الشرح:<\/strong> المستقبل الأندوسومي TLR3 متخصص بالتعرف على الأحماض النووية الفيروسية من نوع dsRNA.", "warn": ""}, {"n": "7", "q": "Primary lymphoid organs include:", "o": ["A) Spleen and Lymph nodes", "B) Bone marrow and Thymus", "C) Tonsils and MALT", "D) Peyer's patches and Spleen"], "a": 1, "ans": "Answer: B) Bone marrow and Thymus", "ex": "<strong>الشرح:<\/strong> نقي العظم (Bone marrow) والغدة السعترية (Thymus) هي الأعضاء اللمفاوية الأولية اللي تتكون وتنضج بيها الخلايا اللمفاوية.", "warn": ""}, {"n": "8", "q": "Which of the following is considered a secondary lymphoid organ?", "o": ["A) Bone marrow", "B) Thymus", "C) Spleen", "D) Liver"], "a": 2, "ans": "Answer: C) Spleen", "ex": "<strong>الشرح:<\/strong> الطحال (Spleen) والعقد اللمفاوية هي أعضاء ثانوية يصير بيها تفعيل الخلايا وتوليد الاستجابة المناعية.", "warn": ""}, {"n": "9", "q": "T cell maturation and education take place in which organ?", "o": ["A) Bone marrow", "B) Thymus", "C) Spleen", "D) Lymph node"], "a": 1, "ans": "Answer: B) Thymus", "ex": "<strong>الشرح:<\/strong> نضوج وتعليم خلايا T حتى تميز بين بروتينات الجسم (Self) والـ (Non-self) يتم بالغدة السعترية Thymus.", "warn": ""}, {"n": "10", "q": "Humans with DiGeorge syndrome suffer from deficiency of which cells due to thymus developmental defects?", "o": ["A) B cells", "B) T cells", "C) Erythrocytes", "D) Neutrophils"], "a": 1, "ans": "Answer: B) T cells", "ex": "<strong>الشرح:<\/strong> مرضى متلازمة DiGeorge عندهم عدم تخلق بالغدة السعترية، فيصير عندهم نقص حاد بنمو ونضج خلايا T.", "warn": ""}, {"n": "11", "q": "The predominant immunoglobulin produced in Mucosal-Associated Lymphoid Tissues (MALT) is:", "o": ["A) IgG", "B) IgA", "C) IgM", "D) IgE"], "a": 1, "ans": "Answer: B) IgA", "ex": "<strong>الشرح:<\/strong> الأغشية المخاطية بالنسيج المضلل MALT تفرز بشكل رئيسي الأجسام المضادة من نوع IgA لحماية الأسطح المخاطية.", "warn": ""}, {"n": "12", "q": "The enzyme responsible for oxygen-dependent microbial killing by producing Reactive Oxygen Species (ROS) in phagolysosomes is:", "o": ["A) Phagocyte oxidase", "B) Inducible nitric oxide synthase (iNOS)", "C) Lysozyme", "D) Myeloperoxidase"], "a": 0, "ans": "Answer: A) Phagocyte oxidase", "ex": "<strong>الشرح:<\/strong> أنزيم Phagocyte oxidase يحول الأكسجين إلى جذور حرة سامة (ROS) تقتل البكتيريا المبتلعة داخل الفاجوليسوسوم.", "warn": ""}, {"n": "13", "q": "Inducible nitric oxide synthase (iNOS) converts which amino acid into microbicidal nitric oxide (NO)?", "o": ["A) Lysine", "B) Arginine", "C) Histidine", "D) Cathepsin"], "a": 1, "ans": "Answer: B) Arginine", "ex": "<strong>الشرح:<\/strong> أنزيم iNOS يحول الحامض الأميني أرجنين (Arginine) إلى غاز أكسيد النيتريك (NO) السام للجراثيم.", "warn": ""}, {"n": "14", "q": "Which chemical barrier in secretions like tears and saliva hydrolyses peptidoglycan in bacterial cell walls?", "o": ["A) Lactoferrin", "B) Lysozyme", "C) Transferrin", "D) Defensins"], "a": 1, "ans": "Answer: B) Lysozyme", "ex": "<strong>الشرح:<\/strong> أنزيم الليسوزايم (Lysozyme) المتواجد بالدموع واللعاب يكسر الرابطة البيبتيدية بجدار الخلايا البكتيرية.", "warn": ""}, {"n": "15", "q": "Lactoferrin contributes to innate host defense by:", "o": ["A) Forming pores in cell membranes", "B) Depriving bacteria of essential iron", "C) Cleaving viral RNA", "D) Activating complement"], "a": 1, "ans": "Answer: B) Depriving bacteria of essential iron", "ex": "<strong>الشرح:<\/strong> بروتين اللاكتوفيرين يربط الحديد ويحرم البكتيريا منه لكونه عنصر أساسي لنموها.", "warn": ""}, {"n": "16", "q": "C-reactive protein (CRP) enhances phagocytosis by binding to which microbial component?", "o": ["A) Flagellin", "B) Phosphorylcholine", "C) Peptidoglycan", "D) Single-stranded RNA"], "a": 1, "ans": "Answer: B) Phosphorylcholine", "ex": "<strong>الشرح:<\/strong> بروتين CRP يرتبط بجزيئات Phosphorylcholine الموجودة على سطح الميكروبات ليطليها ويسهل بلعمتها.", "warn": ""}, {"n": "17", "q": "All of the following are cellular components of innate immunity EXCEPT:", "o": ["A) Neutrophils", "B) Natural Killer (NK) cells", "C) Macrophages", "D) Plasma cells"], "a": 3, "ans": "Answer: D) Plasma cells", "ex": "<strong>الشرح:<\/strong> خلايا البلازما (Plasma cells) تابعة للمناعة التكيفية لأنها الخلايا المفرزة للأجسام المضادة النوعية.", "warn": ""}, {"n": "18", "q": "The anatomical mechanical barrier in the respiratory tract that sweeps mucus and microbes upward is:", "o": ["A) Peristalsis", "B) Mucociliary elevator", "C) Desquamation", "D) Flushing action of urine"], "a": 1, "ans": "Answer: B) Mucociliary elevator", "ex": "<strong>الشرح:<\/strong> الجهاز الهدبي المخاطي بالمسالك التنفسية ينظف ويطرد المخاط والجراثيم للأعلى باتجاه الحلق.", "warn": ""}, {"n": "19", "q": "The site of filtering peripheral blood and removing senescent red blood cells is the:", "o": ["A) Lymph node", "B) Red pulp of the Spleen", "C) White pulp of the Spleen", "D) Thymus medulla"], "a": 1, "ans": "Answer: B) Red pulp of the Spleen", "ex": "<strong>الشرح:<\/strong> اللب الأحمر (Red pulp) بالطحال هو المسؤول عن تصفية الدم والتخلص من كريات الدم الحمراء الهرمة.", "warn": ""}, {"n": "20", "q": "In lymph nodes, B cell activation occurs primarily in the:", "o": ["A) T cell zone", "B) Germinal center within follicles in the cortex", "C) High endothelial venules", "D) Medulla"], "a": 1, "ans": "Answer: B) Germinal center within follicles in the cortex", "ex": "<strong>الشرح:<\/strong> المراكز الجرثومية (Germinal centers) الموجودة بالقشرة الخارجية للعقد اللمفاوية هي المكان المتخصص بتفعيل خلايا B.", "warn": ""}, {"n": "21", "q": "Which pattern recognition receptor (PRR) recognizes unmethylated CpG-containing bacterial DNA?", "o": ["A) TLR4", "B) TLR5", "C) TLR9", "D) TLR7"], "a": 2, "ans": "Answer: C) TLR9", "ex": "<strong>الشرح:<\/strong> المستقبل الأندوسومي TLR9 يكتشف الأحماض النووية للبكتيريا المحتوية على تسلسل CpG.", "warn": ""}, {"n": "22", "q": "Oxygen-independent killing mechanisms in phagocytes include all of the following EXCEPT:", "o": ["A) Cathepsin", "B) Lysozyme", "C) Lactoferrin", "D) Superoxide anion (ROS)"], "a": 3, "ans": "Answer: D) Superoxide anion (ROS)", "ex": "<strong>الشرح:<\/strong> الجذور الحرة (ROS) هي آلية معتمدة على الأكسجين (Oxygen-dependent)، عكس الأنزيمات والبروتينات المحللة.", "warn": ""}, {"n": "23", "q": "After a course of broad-spectrum antibiotics, a patient develops oral candidiasis. Which barrier was disturbed?", "o": ["A) Mechanical barrier (Mucociliary elevator)", "B) Chemical barrier (Low pH)", "C) Biological barrier (Normal flora)", "D) Anatomical barrier (Squamous epithelium)"], "a": 2, "ans": "Answer: C) Biological barrier (Normal flora)", "ex": "<strong>الشرح:<\/strong> المضادات الحيوية واسعة الطيف تقضي على البكتيريا النافعة (Normal flora) اللي تنافس الفطريات على الغذاء فتنمو الكانديدا.", "warn": ""}, {"n": "24", "q": "Compare between innate and adaptive immunity? (سؤال مقالي من أسئلة الملفات ومراجعة المحاضرة)", "o": [], "a": null, "ans": "Answer:<br/>\n    • Innate Immunity: Rapid response (hours), non-specific (uses PRRs/PAMPs), has limited diversity, and lacks memory upon repeat exposure.<br/>\n    • Adaptive Immunity: Slower response (days), highly antigen-specific (uses antibodies/lymphocyte receptors), highly diverse, and forms memory that improves with repeat exposure.", "ex": "<strong>الشرح:<\/strong> المناعة الفطرية سريعة وغير نوعية وبدون ذاكرة، بينما المناعة التكيفية أبطأ وتعتمد على أجسام مضادة وخلايا نوعية وتملك ذاكرة مناعية قوية.", "warn": ""}, {"n": "25", "q": "Mention three oxygen-independent antimicrobial mechanisms used by phagocytes? (سؤال مقالي من مراجعة المحاضرة)", "o": [], "a": null, "ans": "Answer:<br/>\n    1. Lysozyme: Hydrolyses mucopeptides in bacterial cell walls.<br/>\n    2. Lactoferrin: Binds and deprives pathogens of iron.<br/>\n    3. Cationic proteins (Cathepsin): Damages microbial membranes.", "ex": "<strong>الشرح:<\/strong> الآليات غير المعتمدة على الأكسجين تضم: أنزيم الليسوزايم المحلل للجدار، بروتين اللاكتوفيرين المانع للحديد، والبروتينات الكاتيونية المغيرة لنفاذية الغشاء.", "warn": ""}]}, {"code": "L2", "title": "The Complement System", "qs": [{"n": "1", "q": "Classical pathway of complement system is activated by:", "o": ["a) antibody-antigen complexes", "b) antigen", "c) antigenic peptides", "d) antigens bound to MHC"], "a": 0, "ans": "Answer: a) antibody-antigen complexes", "ex": "<strong>الشرح:<\/strong> المسار الكلاسيكي يتحفز حصراً بعد ارتباط الأجسام المضادة (IgG أو IgM) بالأنتيجين.", "warn": ""}, {"n": "2", "q": "Alternate pathway of complement system is activated by:", "o": ["a) antibody-antigen complexes", "b) antigen", "c) microorganisms or its toxins", "d) antigens bound to MHC"], "a": 2, "ans": "Answer: c) microorganisms or its toxins", "ex": "<strong>الشرح:<\/strong> المسار البديل يتحفز بشكل مباشر وتلقائي من جدار الميكروبات أو سمومها وبدون أي حاجة لأجسام مضادة.", "warn": ""}, {"n": "3", "q": "MAC (Membrane Attack Complex) is:", "o": ["a) C5b6789 complex", "b) C5b5678 complex", "c) C5b5789 complex", "d) Protein polysaccharide complex"], "a": 0, "ans": "Answer: a) C5b6789 complex", "ex": "<strong>الشرح:<\/strong> الـ MAC هو المعقد النافذ للغشاء ويتكون من انضمام وتجمع العوامل من C5b إلى C9 لثقب غشاء الخلية الميكروبية.", "warn": ""}, {"n": "4", "q": "Which of the following is the most potent anaphylatoxin?", "o": ["a) C3a", "b) C4a", "c) C5a", "d) C1"], "a": 2, "ans": "Answer: c) C5a", "ex": "<strong>الشرح:<\/strong> على الرغم من أن C3a و C4a و C5a هي سموم أنفيلية (Anaphylatoxins)، إلا أن C5a هو الأقوى في تحفيز الالتهاب وتوسيع الأوعية.", "warn": ""}, {"n": "5", "q": "Body's own cells are protected from membrane attack complex by a surface glycoprotein called:", "o": ["a) MHC", "b) DAF", "c) TCR", "d) BCR"], "a": 1, "ans": "Answer: b) DAF", "ex": "<strong>الشرح:<\/strong> خلايا جسم الإنسان تحمي نفسها من التحليل بواسطة بروتين سطحي مانع اسمه DAF (Decay Accelerating Factor) يمنع انغراس الـ MAC وتفكيك الأنزيمات.", "warn": ""}, {"n": "6", "q": "A complement component which is strongly chemotactic for neutrophils is:", "o": ["a) C3b", "b) C5a", "c) C5b", "d) C3a"], "a": 1, "ans": "Answer: b) C5a", "ex": "<strong>الشرح:<\/strong> العامل C5a يعمل كجاذب كيميائي قوي (Chemoattractant) يستدعي خلايا النيوتروفيل والماكروفاج لمكان الالتهاب.", "warn": ""}, {"n": "7", "q": "Paroxysmal nocturnal hemoglobinuria (PNH) results from deficiency in:", "o": ["a) Myeloperoxidase", "b) Decay accelerating factor (DAF)", "c) Classical pathway C components", "d) C1 inhibitor"], "a": 1, "ans": "Answer: b) Decay accelerating factor (DAF)", "ex": "<strong>الشرح:<\/strong> مرض الـ PNH يحدث نتيجة نقص بروتين DAF المانع، مما يترتب عليه قيام المتمم بتحليل كريات الدم الحمراء وخروج الهيموغلوبين مع الإدرار.", "warn": ""}, {"n": "8", "q": "Your patient is a 20-year-old woman who complains of swellings on her arms and legs and a feeling of fullness in her throat. You suspect she may have angioedema caused by a complement abnormality. Which is the explanation?", "o": ["a) She has too little C1 inhibitor.", "b) She has too little C3b.", "c) She has too little factor B.", "d) She has too much C5a."], "a": 0, "ans": "Answer: a) She has too little C1 inhibitor.", "ex": "<strong>الشرح:<\/strong> الوذمة الوعائية الوراثية (Hereditary Angioedema) تسبب تورمات بالجلد والحلق نتيجة نقص البروتين المثبط C1-INH.", "warn": ""}, {"n": "9", "q": "Which complement fragment is considered as anaphylatoxin?", "o": ["a. C3b", "b. C3a, and C5a", "c. C1q", "d. C1s"], "a": 1, "ans": "Answer: b. C3a, and C5a", "ex": "<strong>الشرح:<\/strong> النواتج الانشطارية C3a و C5a هي السموم الأنفيلية المسؤولة عن إطلاق الهستامين وتوسيع الأوعية الدموية.", "warn": ""}, {"n": "10", "q": "Somatic cell is protected from C3b activation by the following:", "o": ["a) short half-life of C3b", "b) Presence of DAF", "c) Both A and B", "d) none of them"], "a": 2, "ans": "Answer: c) Both A and B", "ex": "<strong>الشرح:<\/strong> خلايا جسمنا تحمي نفسها لأن جزيء C3b يتفكك بسرعة من جهة، ووجود بروتينات مانعة مثل DAF تفكك أنزيمات المتمم على غشاء الخلية من جهة أخرى.", "warn": ""}, {"n": "11", "q": "Regarding the complement pathway, which one of the following is the most accurate?", "o": ["a) C3 convertase protects normal cells from lysis.", "b) Gram-positive bacteria are more likely to be killed by complement than Gram-negative.", "c) MAC is formed only in classic pathway.", "d) The first time a person is exposed to a microorganism, the alternative pathway is more likely to be activated than the classic pathway."], "a": 3, "ans": "Answer: d) The first time a person is exposed to a microorganism, the alternative pathway is more likely to be activated than the classic pathway.", "ex": "<strong>الشرح:<\/strong> في أول تعرض للميكروب، الجسم لا يملك أجساماً مضادة بعد، لذلك يتفعل المسار البديل (Alternative) مباشرة دون الحاجة لأجسام مضادة.", "warn": ""}, {"n": "12", "q": "Which of the following is required for C1 activation in the classical pathway?", "o": ["a) Ca (Calcium)", "b) Mg (Magnesium)", "c) Mn", "d) Zn"], "a": 0, "ans": "Answer: a) Ca (Calcium)", "ex": "<strong>الشرح:<\/strong> الكالسيوم (Ca²⁺) هو الأيون الضروري لربط وتفعيل معقد C1 في بداية المسار الكلاسيكي.", "warn": ""}, {"n": "13", "q": "In alternative pathway, which factors are involved?", "o": ["a) factor B", "b) factor D", "c) both a and b", "d) Only factor F"], "a": 2, "ans": "Answer: c) both a and b", "ex": "<strong>الشرح:<\/strong> المسار البديل يحتاج تدخل بروتينات خاصة هي Factor B و Factor D لتكوين أنزيم C3 convertase الخاص به.", "warn": ""}, {"n": "14", "q": "Biological role of complement system includes:", "o": ["a) cytolysis and chemotaxis", "b) opsonisation", "c) anaphylatoxin and enhanced antibody production", "d) all of these"], "a": 3, "ans": "Answer: d) all of these", "ex": "<strong>الشرح:<\/strong> المتمم يقوم بكل هذه الأدوار: تسهيل البلعمة (Opsonization)، التحليل الخلوي (Cytolysis)، والجذب الكيميائي والالتهاب.", "warn": ""}, {"n": "15", "q": "Classical pathway of complement system is involved in:", "o": ["a) specific defence", "b) adaptive immunity", "c) both a and b", "d) non-specific defence"], "a": 2, "ans": "Answer: c) both a and b", "ex": "<strong>الشرح:<\/strong> المسار الكلاسيكي يتطلب أجساماً مضادة نوعية، لذا هو جزء من المناعة التكيفية المتخصصة (Adaptive immunity).", "warn": ""}, {"n": "16", "q": "Alternate pathway of complement system is involved in:", "o": ["a) non-specific defence", "b) innate immunity", "c) both a and b", "d) adaptive immunity"], "a": 2, "ans": "Answer: c) both a and b", "ex": "<strong>الشرح:<\/strong> المسار البديل يعتبر خط دفاع مناعي فطري غير نوعي (Innate immunity) لأنه يتفعل مباشرة دون الحاجة لأجسام مضادة.", "warn": ""}, {"n": "17", "q": "Which of the following statements are true regarding complement activation?", "o": ["a) lysis of pathogen, tumor cells and allografts", "b) production of mediators that attracts neutrophils", "c) opsonization", "d) all of these"], "a": 3, "ans": "Answer: d) all of these", "ex": "<strong>الشرح:<\/strong> تفعيل المتمم يؤدي لتحليل الخلايا الضارة، إفراز عوامل جذب النيوتروفيل، وتغطية الميكروبات لبلعمتها.", "warn": ""}, {"n": "18", "q": "Complement system consists of over how many proteins in serum?", "o": ["a) 10 proteins", "b) 30 proteins", "c) 50 proteins", "d) 5 proteins"], "a": 1, "ans": "Answer: b) 30 proteins", "ex": "<strong>الشرح:<\/strong> بروتينات المتمم تتجاوز الـ 30 بروتيناً تسبح في مصل الدم بشكل غير فعال حتى يتم تفعيلها.", "warn": ""}, {"n": "19", "q": "Which complement protein has the highest serum concentration?", "o": ["a) C1", "b) C2", "c) C3", "d) C5"], "a": 2, "ans": "Answer: c) C3", "ex": "<strong>الشرح:<\/strong> العامل C3 يمتلك أعلى تركيز في بلازما الدم بين كل عوامل المتمم (حوالي 1.2 mg/ml).", "warn": ""}, {"n": "20", "q": "A 19-year-old patient has his second episode of meningococcal meningitis (Neisseria). What is the defect?", "o": ["a) Antibody deficiency", "b) Phagocyte defect", "c) Complement deficiency (C5-C9 / MAC deficiency)", "d) Functional asplenia"], "a": 2, "ans": "Answer: c) Complement deficiency (C5-C9 / MAC deficiency)", "ex": "<strong>الشرح:<\/strong> القضاء على بكتيريا الـ Neisseria يتطلب تحديداً تشكيل معقد الـ MAC (من C5 إلى C9)، ونقصه يسبب التهاب السحايا المتكرر.", "warn": ""}, {"n": "21", "q": "Which deficiency causes SLE-like (Lupus) autoimmune disease and infections with encapsulated bacteria?", "o": ["a) C1q, C1r/C1s, C4, C2 deficiency", "b) C5-C9 deficiency", "c) Properdin deficiency", "d) C1-INH deficiency"], "a": 0, "ans": "Answer: a) C1q, C1r/C1s, C4, C2 deficiency", "ex": "<strong>الشرح:<\/strong> نقص مكونات المسار الكلاسيكي المبكرة يمنع إزالة المعقدات المناعية من الدم فيؤدي لأمراض مناعية شبيهة بالذئبة SLE.", "warn": ""}, {"n": "22", "q": "Opsonization is mainly mediated by which complement fragment?", "o": ["a) C3a", "b) C3b", "c) C5a", "d) C5b"], "a": 1, "ans": "Answer: b) C3b", "ex": "<strong>الشرح:<\/strong> الجزء C3b هو الطاهي الأساسي الذي يلتصق بسطح البكتيريا ويرتبط بمستقبلات CR1 للبلعمة.", "warn": ""}, {"n": "23", "q": "A woman has recurrent non-itchy swelling of lips and colicky abdominal pain. What is the expected lab result?", "o": ["a) Low C3 and low C4", "b) Low C4, normal C3, low C1-INH", "c) Normal C3 and C4, low AH50", "d) Low C3, normal C4"], "a": 1, "ans": "Answer: b) Low C4, normal C3, low C1-INH", "ex": "<strong>الشرح:<\/strong> في حالة HAE يقل C1-INH وتظهر الفحوصات انخفاض مستوى C4 بينما يبقى C3 ضمن المعدل الطبيعي.", "warn": ""}, {"n": "24", "q": "How does Pseudomonas evade the complement system?", "o": ["a) Capsule formation", "b) Elastases inactivate C3a & C5a", "c) Thick peptidoglycan wall", "d) Long LPS chains"], "a": 1, "ans": "Answer: b) Elastases inactivate C3a & C5a", "ex": "<strong>الشرح:<\/strong> بكتيريا Pseudomonas تفرز أنزيمات الايلاستيز التي تحطم نواتج المتمم الانفيلية C3a و C5a المسببة للالتهاب.", "warn": ""}, {"n": "25", "q": "Streptococcus pneumoniae evades complement phagocytosis mainly by:", "o": ["a) Producing elastase", "b) Bacterial capsule providing extra physical barrier", "c) Long LPS side chains", "d) Mimicking DAF"], "a": 1, "ans": "Answer: b) Bacterial capsule providing extra physical barrier", "ex": "<strong>الشرح:<\/strong> الكبسولة السميكة للبكتيريا تمنع وصول بروتينات المتمم وتعرقل ارتباط C3b بسطح الخلية.", "warn": ""}, {"n": "26", "q": "C3 convertase of the Classical Pathway is formed by:", "o": ["a) C3bBb", "b) C4b2a (or C4b2b)", "c) C4b2a3b", "d) C5b6789"], "a": 1, "ans": "Answer: b) C4b2a (or C4b2b)", "ex": "<strong>الشرح:<\/strong> اتحاد الجزئين C4b و C2a يشكل أنزيم C3 convertase في المسار الكلاسيكي.", "warn": ""}, {"n": "27", "q": "C5 convertase of the Classical Pathway is composed of:", "o": ["a) C4b2a", "b) C4b2a3b", "c) C3bBbC3b", "d) C1qrs"], "a": 1, "ans": "Answer: b) C4b2a3b", "ex": "<strong>الشرح:<\/strong> انضمام جزيء C3b لـ C3 convertase يعطي أنزيم C5 convertase المسؤول عن انقسام C5 لبدء تكون الـ MAC.", "warn": ""}, {"n": "28", "q": "What triggers the Lectin Pathway of complement activation?", "o": ["a) IgG and IgM antibodies", "b) Microbial carbohydrates (e.g., Mannose via MBL)", "c) Spontaneous C3 hydrolysis", "d) Antigen-antibody complexes"], "a": 1, "ans": "Answer: b) Microbial carbohydrates (e.g., Mannose via MBL)", "ex": "<strong>الشرح:<\/strong> مسار اللكتين يتحفز بارتباط بروتين MBL بالسكريات (المأنوز) الموجودة على غشاء الجراثيم.", "warn": ""}, {"n": "29", "q": "Receptor CR1 present on erythrocytes (RBCs) binds to which complement component for immune complex clearance?", "o": ["a) C1q", "b) C3b", "c) C5a", "d) C9"], "a": 1, "ans": "Answer: b) C3b", "ex": "<strong>الشرح:<\/strong> مستقبلات CR1 على كريات الدم الحمراء ترتبط بالـ C3b لنقل وتصفية المعقدات المناعية للطحال والكبد.", "warn": ""}, {"n": "30", "q": "Lack of CR1 receptors on RBCs results in:", "o": ["a) Decreased binding of C3b to RBCs", "b) Decreased clearance of immune complexes by the spleen", "c) Both a and b", "d) Increased lysis of RBCs"], "a": 2, "ans": "Answer: c) Both a and b", "ex": "<strong>الشرح:<\/strong> غياب مستقبلات CR1 على الكريات يمنع ارتباط C3b وتخفيف ترسب المعقدات المناعية بالطحال.", "warn": ""}, {"n": "31", "q": "Mention the main biological functions of the complement system?", "o": [], "a": null, "ans": "Answer:<br/>\n    1. Opsonization: C3b coats pathogens to enhance phagocytosis.<br/>\n    2. Cell Lysis: Formation of MAC (C5b-C9) to lyse bacteria.<br/>\n    3. Inflammation & Chemotaxis: C3a and C5a act as anaphylatoxins and attract neutrophils.<br/>\n    4. Clearance of Immune Complexes: C3b-bound complexes are carried by RBCs (CR1) to the liver/spleen.", "ex": "<strong>الشرح:<\/strong> الوظائف الأربعة هي: تسهيل البلعمة، اختراق وتحليل غشاء البكتيريا بالـ MAC، إحداث الالتهاب وجذب الخلايا، والتنظيف المناعي.", "warn": ""}, {"n": "32", "q": "Enumerate three mechanisms used by bacteria to evade the complement system?", "o": [], "a": null, "ans": "Answer:<br/>\n    1. Long LPS side chains (e.g., E. coli) prevent MAC insertion.<br/>\n    2. Bacterial capsule (e.g., Streptococcus pneumoniae) provides a physical barrier.<br/>\n    3. Elastase enzymes (e.g., Pseudomonas) degrade anaphylatoxins C3a and C5a.", "ex": "<strong>الشرح:<\/strong> آليات هروب البكتيريا: سلاسل دهنية طويلة تعيق الـ MAC، كبسولة تمنع الالتصاق، أو أنزيمات تخرب عوامل الالتهاب C3a و C5a.", "warn": ""}]}]}];
let cd=null,cl=null,st=null,muted=false,AC;
const P={};
const $=id=>document.getElementById(id);
function go(s){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===s));scrollTo(0,0)}
$('docs').innerHTML=DOCS.map((d,i)=>`<button class="big" onclick="openDoc(${i})">${d.name}<small>${d.sub}</small></button>`).join('');
function openDoc(i){cd=DOCS[i];$('lt').textContent=cd.name;
 $('lects').innerHTML=cd.lects.map((l,j)=>`<button class="big" onclick="openLec(${j})">${l.code}<small>${l.title} • ${l.qs.length} سؤال</small></button>`).join('');go('lec')}
function openLec(j){cl=j;const k=cd.id+j;
 st=P[k]||(P[k]={a:[],shown:[]});
 $('qt2').textContent=cd.name+' — '+cd.lects[j].code;go('quiz');draw()}
function scorable(q){return q.o.length>0&&q.a!==null}
function score(){const L=cd.lects[cl].qs;let c=0,t=0;L.forEach((q,i)=>{if(scorable(q)){t++;if(st.a[i]===q.a)c++}});return[c,t]}
function hud(){const L=cd.lects[cl].qs,[c,t]=score();
 let d=0;L.forEach((q,i)=>{if(q.o.length?st.a[i]!==undefined:st.shown[i])d++});
 $('sc').textContent='✓ '+c+'/'+t;$('pg').textContent=d+'/'+L.length;
 $('bar').firstElementChild.style.width=(d/L.length*100)+'%';
 const r=$('rs');if(r)r.innerHTML=resHTML()}
function resHTML(){const[c,t]=score();return `<div style="font-size:44px">🏆</div><div class="n">${c}/${t}</div><p>الإجابات الصحيحة</p><div class="row"><button onclick="restart()">إعادة المحاضرة 🔄</button><button class="g" onclick="go('lec')">المحاضرات</button><button class="g" onclick="go('home')">القائمة الأولى</button></div>`}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function draw(){const L=cd.lects[cl].qs;let h='';
 L.forEach((q,i)=>{h+=`<div class="q" id="q${i}"><span class="qn">${q.n}</span><div class="qt" dir="auto">${esc(q.q)}</div>`;
  if(q.o.length)h+='<div class="opts">'+q.o.map((o,k)=>`<button class="opt" dir="auto" onclick="pick(${i},${k})">${esc(o)}</button>`).join('')+'</div>';
  else h+=`<button class="show" onclick="reveal(${i})">إظهار الإجابة</button>`;
  h+='<div class="fb"></div></div>'});
 h+=`<div class="q end" id="rs"></div>`;$('stage').innerHTML=h;
 L.forEach((q,i)=>{if(q.o.length&&st.a[i]!==undefined)paint(i,st.a[i],false);else if(!q.o.length&&st.shown[i])reveal(i,true)});hud()}
function fbHTML(q,kind){
 if(kind==='')return `<div class="ans">${q.ans}</div><div class="ex">${q.ex}</div>`+(q.warn?`<div class="wn">${esc(q.warn)}</div>`:'');
 const r=kind==='ok'?'✔ إجابة صحيحة':kind==='no'?'✘ إجابة خاطئة':'ℹ️ سؤال غير محسوم';
 return `<div class="res ${kind}">${r}</div>`+(kind==='neu'?`<div class="ans">${q.ans}</div>`:'')+`<div class="ex">${q.ex}</div>`+(q.warn?`<div class="wn">${esc(q.warn)}</div>`:'')}
function pick(i,k){if(st.a[i]!==undefined)return;st.a[i]=k;paint(i,k,true);hud()}
function paint(i,k,snd){const q=cd.lects[cl].qs[i],box=$('q'+i),bs=box.querySelectorAll('.opt');
 bs.forEach(b=>b.disabled=true);let kind;
 if(q.a===null){bs[k].classList.add('neu');kind='neu'}
 else if(k===q.a){bs[k].classList.add('ok');kind='ok'}
 else{bs[k].classList.add('no');bs[q.a].classList.add('ok');kind='no'}
 const f=box.querySelector('.fb');f.innerHTML=fbHTML(q,kind);f.classList.add('on');
 if(snd)beep(kind)}
function reveal(i,quiet){const q=cd.lects[cl].qs[i],box=$('q'+i);st.shown[i]=true;
 box.querySelector('.show').style.display='none';
 const f=box.querySelector('.fb');f.innerHTML=fbHTML(q,'');f.classList.add('on');if(!quiet){beep('neu');hud()}}
function restart(){delete P[cd.id+cl];openLec(cl)}
function toggleMute(){muted=!muted;$('mu').textContent=muted?'🔇':'🔊'}
function beep(kind){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const seq=kind==='ok'?[[660,0,.1,'sine'],[880,.1,.16,'sine']]:kind==='no'?[[250,0,.14,'triangle'],[170,.13,.2,'triangle']]:[[520,0,.12,'sine']];
 seq.forEach(([f,s,d,w])=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+s;o.type=w;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)})}catch(e){}}
/* animated floating particles */
(function(){const c=$('bg'),x=c.getContext('2d');let W,H,ps=[];
 const cols=['255,205,160','190,220,200','250,225,170','235,190,190','210,200,235'];
 function rs(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*r;c.height=H*r;x.setTransform(r,0,0,r,0,0)}
 function mk(){return{x:Math.random()*W,y:Math.random()*H,r:4+Math.random()*20,vx:(Math.random()-.5)*.3,vy:-.15-Math.random()*.4,ph:Math.random()*6.28,c:cols[Math.random()*cols.length|0],a:.22+Math.random()*.3}}
 rs();const n=innerWidth<700?30:55;for(let i=0;i<n;i++)ps.push(mk());
 addEventListener('resize',rs);
 function f(t){x.clearRect(0,0,W,H);for(const p of ps){p.x+=p.vx+Math.sin(t/1800+p.ph)*.25;p.y+=p.vy;
  if(p.y<-30){p.y=H+30;p.x=Math.random()*W}if(p.x<-30)p.x=W+30;if(p.x>W+30)p.x=-30;
  const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(${p.c},${p.a})`);g.addColorStop(1,`rgba(${p.c},0)`);
  x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,6.28);x.fill()}
  if(!document.hidden)requestAnimationFrame(f);else setTimeout(()=>requestAnimationFrame(f),500)}
 requestAnimationFrame(f)})();
</script>
